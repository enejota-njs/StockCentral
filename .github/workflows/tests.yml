name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stockcentral_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockcentral_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_DB: stockcentral_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar dependencias
        run: python -m pip check
      - name: Aplicar migracoes
        run: python -m alembic upgrade head
      - name: Conferir modelos e migracoes
        run: python -m alembic check
      - name: Executar testes
        run: python -m pytest -q
